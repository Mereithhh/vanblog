<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Public article TOC e2e</title>
    <link rel="stylesheet" href="./bytemd.css" />
    <link rel="stylesheet" href="./katex.min.css" />
    <style>
      html,
      body,
      #app {
        margin: 0;
        min-height: 100%;
      }
      .toc-e2e-layout {
        display: flex;
        align-items: flex-start;
        gap: 24px;
        padding: 16px 24px 80px;
        font-family: sans-serif;
      }
      .toc-e2e-article {
        flex: 1;
        max-width: 720px;
      }
      .toc-e2e-article p {
        min-height: 720px;
        margin: 0 0 24px;
        background: #f5f5f5;
      }
      .toc-e2e-article img {
        display: block;
        max-width: 100%;
        margin: 0 0 24px;
        background: #e6e6e6;
      }
      .toc-e2e-article h1,
      .toc-e2e-article h2,
      .toc-e2e-article h3,
      .toc-e2e-article h4 {
        margin: 0 0 16px;
        scroll-margin-top: 0;
      }
      .toc-e2e-toc {
        position: sticky;
        top: 16px;
        width: 240px;
        border: 1px solid #d9d9d9;
        border-radius: 8px;
        padding: 8px 12px;
        background: #fff;
      }
      .title-anchor {
        cursor: pointer;
        padding: 6px 4px;
        display: block;
        text-decoration: none;
        color: inherit;
      }
      .heading-permalink {
        margin-left: 0.4em;
        font-weight: 400;
        text-decoration: none;
        user-select: text;
      }
      .toc-drawer-fab {
        display: flex;
        justify-content: center;
        align-items: center;
        position: fixed;
        right: 1rem;
        bottom: calc(2rem + 42px + 12px);
        width: 42px;
        height: 42px;
        background-color: #fff;
        z-index: 90;
        cursor: pointer;
        border: 0;
        box-shadow: 2px 2px 10px 0 rgba(0, 0, 0, 0.15);
      }
      .toc-drawer-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.4);
        z-index: 100;
      }
      .toc-drawer-panel {
        position: fixed;
        top: 0;
        right: 0;
        height: 100%;
        width: min(80vw, 320px);
        z-index: 101;
        overflow-y: auto;
        background: #fff;
        box-shadow: -2px 0 10px rgba(0, 0, 0, 0.15);
        padding: 16px 12px 24px;
      }
      .toc-drawer-close {
        position: absolute;
        top: 8px;
        right: 8px;
        width: 32px;
        height: 32px;
        border: 0;
        background: transparent;
        font-size: 24px;
        cursor: pointer;
      }
      @media (min-width: 1024px) {
        .toc-drawer-root {
          display: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="./toc.js"></script>
  </body>
</html>
