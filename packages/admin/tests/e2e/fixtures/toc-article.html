<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Public article TOC e2e</title>
    <link rel="stylesheet" href="./bytemd.css" />
    <link rel="stylesheet" href="./katex.min.css" />
    <style>
      html,
      body,
      #app {
        margin: 0;
        min-height: 100%;
      }
      .toc-e2e-layout {
        display: flex;
        align-items: flex-start;
        gap: 24px;
        padding: 16px 24px 80px;
        font-family: sans-serif;
      }
      .toc-e2e-article {
        flex: 1;
        max-width: 720px;
      }
      .toc-e2e-article p {
        min-height: 720px;
        margin: 0 0 24px;
        background: #f5f5f5;
      }
      .toc-e2e-article img {
        display: block;
        max-width: 100%;
        margin: 0 0 24px;
        background: #e6e6e6;
      }
      .toc-e2e-article h1,
      .toc-e2e-article h2,
      .toc-e2e-article h3,
      .toc-e2e-article h4 {
        margin: 0 0 16px;
        scroll-margin-top: 0;
      }
      .toc-e2e-toc {
        position: sticky;
        top: 16px;
        width: 240px;
        border: 1px solid #d9d9d9;
        border-radius: 8px;
        padding: 8px 12px;
        background: #fff;
      }
      .title-anchor {
        cursor: pointer;
        padding: 6px 4px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="./toc.js"></script>
  </body>
</html>
