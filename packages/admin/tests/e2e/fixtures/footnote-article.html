<!DOCTYPE html>
<html lang="zh-CN" class="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Public article footnote e2e</title>
    <link rel="stylesheet" href="./bytemd.css" />
    <link rel="stylesheet" href="./github-markdown.css" />
    <style>
      html,
      body,
      #app {
        margin: 0;
        min-height: 100%;
      }
      .footnote-e2e-article {
        max-width: 720px;
        padding: 16px 24px 80px;
      }
      .footnote-e2e-article > .markdown-body > p,
      .footnote-e2e-article p {
        min-height: 720px;
        margin: 0 0 24px;
      }
      .footnote-e2e-article .footnotes p {
        min-height: 0;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="./footnote.js"></script>
  </body>
</html>
