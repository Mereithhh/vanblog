<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Category expand UX e2e</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 24px;
        color: #374151;
      }
      button {
        font: inherit;
      }
      .flex {
        display: flex;
      }
      .flex-col {
        flex-direction: column;
      }
      .items-center {
        align-items: center;
      }
      .justify-end {
        justify-content: flex-end;
      }
      .w-full {
        width: 100%;
      }
      .text-left {
        text-align: left;
      }
      .inline-block {
        display: inline-block;
      }
      .mt-2 {
        margin-top: 0.5rem;
      }
      .mb-3 {
        margin-bottom: 0.75rem;
      }
      .mb-4 {
        margin-bottom: 1rem;
      }
      .ml-2 {
        margin-left: 0.5rem;
      }
      .gap-3 {
        gap: 0.75rem;
      }
      .overflow-hidden {
        overflow: hidden;
      }
      .cursor-pointer {
        cursor: pointer;
      }
      .border-0 {
        border: 0;
      }
      .p-0 {
        padding: 0;
      }
      .bg-transparent {
        background: transparent;
      }
      .rounded {
        border-radius: 0.25rem;
      }
      .bg-gray-200 {
        background: #e5e7eb;
      }
      .text-sm {
        font-size: 0.875rem;
      }
      .text-xl {
        font-size: 1.25rem;
      }
      .text-2xl {
        font-size: 1.5rem;
      }
      .text-lg {
        font-size: 1.125rem;
      }
      .font-bold {
        font-weight: 700;
      }
      .font-normal {
        font-weight: 400;
      }
      .text-gray-400 {
        color: #9ca3af;
      }
      .text-gray-500 {
        color: #6b7280;
      }
      .leading-tight {
        line-height: 1.25;
      }
      .text-center {
        text-align: center;
      }
      .rotate-90 {
        transform: rotate(90deg);
      }
      .transition-transform {
        transition: transform 0.2s;
      }
      .transition-all {
        transition: all 0.2s;
      }
      .space-y-2 > * + * {
        margin-top: 0.5rem;
      }
      .border-b {
        border-bottom: 1px solid #e5e7eb;
      }
      .border-dashed {
        border-bottom-style: dashed;
      }
      .pb-1 {
        padding-bottom: 0.25rem;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="./category-expand.js"></script>
  </body>
</html>
